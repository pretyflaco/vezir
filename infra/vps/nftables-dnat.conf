#!/usr/sbin/nft -f
#
# nftables DNAT for vezir's public TLS-passthrough front (VPS end).
#
# Forwards public TCP :443 into the WireGuard tunnel to muscle
# (10.99.0.2:443), where Caddy terminates TLS. The VPS only moves
# encrypted bytes — it never terminates TLS, so it never sees plaintext.
#
# Prerequisites on the VPS:
#   * wg0 up with the VPS at 10.99.0.1, muscle reachable at 10.99.0.2
#   * net.ipv4.ip_forward=1  (see /etc/sysctl.d/99-vezir-forward.conf)
#
# Load with:  sudo nft -f /etc/nftables.d/vezir-dnat.conf
# (or include it from /etc/nftables.conf so it persists across reboot.)
#
# This file is self-contained: it flushes and recreates its own table so
# re-loading is idempotent and won't stack duplicate rules.

table ip vezir_nat {
	# Public interface on this VPS (confirm with `ip -br link`; e.g. ens3
	# on many cloud images, not eth0). Some providers 1:1-NAT the public
	# IP to a private address on this interface, so inbound :443 arrives
	# with the private destination — that's why the rule matches on the
	# inbound interface + dport, not on a specific destination IP.

	chain prerouting {
		type nat hook prerouting priority dstnat; policy accept;
		# Public HTTPS arriving on ens3 -> muscle over the tunnel.
		# Scope to ens3 so we never DNAT traffic that's already inside
		# the wg0 tunnel.
		iifname "ens3" tcp dport 443 dnat to 10.99.0.2:443
	}

	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		# Masquerade the forwarded traffic onto wg0 so muscle's replies
		# come back through the VPS (muscle's default route is its own
		# home link, not this tunnel).
		ip daddr 10.99.0.2 tcp dport 443 oifname "wg0" masquerade
	}
}

table ip vezir_filter {
	chain forward {
		type filter hook forward priority filter; policy accept;
		# Allow the DNATed 443 stream and its return path. (ufw also
		# governs forwarding; these rules document intent and keep this
		# table self-sufficient if ufw forwarding policy is DROP.)
		ct state established,related accept
		tcp dport 443 ip daddr 10.99.0.2 oifname "wg0" accept
	}
}
