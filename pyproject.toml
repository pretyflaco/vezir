[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vezir"
dynamic = ["version"]
description = "Internal scribe service that wraps meetscribe for team-scale meeting capture, transcription, summarization, and speaker labeling"
readme = "README.md"
# Upper bound: coincurve (via the [nostr] extra, pulled by [tui]) has no
# cp314 wheel yet, so a 3.14 install falls back to a failing source build.
# Cap at <3.14 so pip/pipx select 3.13 (or refuse with a clear message)
# instead of a cryptic coincurve build error. Relax once coincurve ships
# cp314 wheels.
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Blink"}]
keywords = [
    "meeting",
    "transcription",
    "scribe",
    "team",
    "self-hosted",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    # Client-side base.  Includes millet-record (formerly
    # meetscribe-record) for `vezir scribe`'s capture wrapper.  Does
    # NOT pull in transcription / diarization / summarization deps;
    # those land via `pip install vezir[server]`.
    "click>=8.0",
    "httpx>=0.27",
    "ulid-py>=1.1",
    "millet-record>=0.4.4",
]

[project.scripts]
vezir = "vezir.cli:main"

[project.urls]
Homepage = "https://github.com/pretyflaco/vezir"
Repository = "https://github.com/pretyflaco/vezir"
Issues = "https://github.com/pretyflaco/vezir/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vezir*"]

[tool.setuptools.package-data]
# v0.7.0: web templates + static assets + Tkinter logo PNGs removed
# (HTML dashboard + Tk widget dropped).  Nothing left to bundle.
vezir = []

[tool.setuptools.dynamic]
# Single source of truth lives at vezir/__init__.py:__version__.
# Mirrors the pattern used in millet-record (formerly meetscribe-record)
# since M6c.i.
version = {attr = "vezir.__version__"}

[project.optional-dependencies]
# Server side: full FastAPI app + worker that shells out to millet
# (transcribe, label, sync).  Install on the GPU box that runs `vezir serve`.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    # v0.7.0: jinja2 dropped along with the HTML dashboard.
    # vezir 0.4.0's worker shells out to `millet transcribe --summary-preset
    # <id>` and relies on apply_labels() accepting the summary_preset kwarg.
    # Since vezir 0.11.0 the server hard-requires millet-pipeline >= 0.13.0 at
    # runtime (meet_runner probes and raises otherwise), because label apply /
    # retry-summary go through `millet label --apply-json`.  The install pin
    # and the runtime floor match so a `pip install vezir[server]` that
    # satisfies the extra can't fail at runtime.
    # Raised to >= 0.15.0 for attachment passthrough in `millet sync`: the
    # session's `attachments/` subdir is pushed to the team repo verbatim.  An
    # older millet stores attachments fine but silently never syncs them.
    # (Earlier pins: >=0.12.5 title-aware schedule matching; >=0.12.7 in-room
    # multi-speaker collapse fix; >=0.13.0 label --apply-json.)
    "millet-pipeline>=0.15.0",
    # Pure-Python QR generation (~76 KB) for the device enrollment page.
    # See vezir/server/enroll.py.
    "segno>=1.5",
    # Nostr (NIP-98) auth: BIP-340 Schnorr verification of signed HTTP-Auth
    # events (vezir/server/nip98.py) + short-lived session JWTs minted on
    # successful login (vezir/server/nostr_auth.py).  Server-only: the thin
    # clients present a signed event / bearer JWT but never verify signatures.
    "coincurve>=20",
    "pyjwt>=2.8",
    # Google sign-in (server-side): verify Google ID tokens obtained by the
    # client via the OAuth 2.0 Device Authorization Grant, mapping a verified
    # @<domain> email to a member.  See vezir/server/google_auth.py.
    "google-auth>=2.0",
    # MLX Whisper ASR backend, auto-detected on Apple Silicon by
    # vezir.config.meet_asr_backend(). Pulled only on Darwin/arm64;
    # pip skips this line on Linux/Windows via the environment marker.
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# TUI thin client: Textual-based desktop client that matches vezir-android
# 0.2.5 feature parity. Replaces `vezir gui` for everything except the
# always-on-top floating record widget. `pip install vezir[tui]` pulls
# textual; the optional `serve` mode additionally needs textual-serve
# (install separately when you want to publish the TUI over HTTP).
# Nostr login (`vezir login`): NIP-46 remote signing for the thin
# client.  Opt-in so a plain `pip install vezir` stays lean — these are
# imported lazily by the login command only.
#   * coincurve      — secp256k1 (Schnorr sign + ECDH for NIP-44)
#   * cryptography   — ChaCha20 for NIP-44 v2
#   * websocket-client — sync relay transport for the NIP-46 round-trip
#   * segno          — terminal QR for the nostrconnect:// URI
nostr = [
    "coincurve>=20",
    "cryptography>=42",
    "websocket-client>=1.5",
    "segno>=1.5",
]
tui = ["textual>=0.80", "vezir[nostr]"]
dev = ["ruff", "pytest", "pytest-asyncio", "pytest-timeout", "mypy"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are intended to be called in argument defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "RUF"]
"vezir/client/tui/*.py" = ["RUF012"]
"vezir/server/uploads.py" = ["B008"]
"vezir/server/attachments.py" = ["B008"]
"vezir/server/teams.py" = ["B008"]
"vezir/server/labels.py" = ["B008"]
"vezir/server/migrations.py" = ["RUF002", "RUF003"]
"vezir/server/meet_runner.py" = ["E501"]
"vezir/client/audio.py" = ["RUF003"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
# Third-party deps (segno, ctranslate2, millet, textual internals) ship
# no type stubs; don't fail the allowlist on their account.
ignore_missing_imports = true
# CI runs mypy on the allowlist modules below; keep imports of
# non-allowlisted first-party modules from cascading errors.
follow_imports = "silent"

[[tool.mypy.overrides]]
# Strict type-checking allowlist.  Widen this list as modules are
# annotated; CI runs `mypy` against exactly these modules (see ci.yml).
module = [
    "vezir.config",
    "vezir.doctor",
    "vezir.server.app",
    "vezir.server.ratelimit",
    "vezir.server.enroll",
    "vezir.server.sessions_auth",
]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
# Auto-collect `async def` tests written for textual.pilot without
# requiring a per-test @pytest.mark.asyncio decorator. Matches the
# pattern Textual's own test suite uses.
asyncio_mode = "auto"
# Per-test timeout (seconds). Any test exceeding this is likely stuck on
# a network call or audio device. Prevents CI from hanging indefinitely.
timeout = 60
