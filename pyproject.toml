[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vezir"
dynamic = ["version"]
description = "Internal scribe service that wraps meetscribe for team-scale meeting capture, transcription, summarization, and speaker labeling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Blink"}]
keywords = [
    "meeting",
    "transcription",
    "scribe",
    "team",
    "self-hosted",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    # Client-side base.  Includes millet-record (formerly
    # meetscribe-record) for `vezir scribe`'s capture wrapper.  Does
    # NOT pull in transcription / diarization / summarization deps;
    # those land via `pip install vezir[server]`.
    "click>=8.0",
    "httpx>=0.27",
    "ulid-py>=1.1",
    "millet-record>=0.4.0",
]

[project.scripts]
vezir = "vezir.cli:main"

[project.urls]
Homepage = "https://github.com/pretyflaco/vezir"
Repository = "https://github.com/pretyflaco/vezir"
Issues = "https://github.com/pretyflaco/vezir/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vezir*"]

[tool.setuptools.package-data]
vezir = [
    "web/templates/*.html",
    "web/static/*",
    # Pre-rendered logo PNGs for the Tkinter desktop client.  Source
    # SVGs live in assets/logo/ outside the package; the 400/800-px
    # variants are checked in so vezir installs need no SVG renderer.
    "client/assets/*.png",
]

[tool.setuptools.dynamic]
# Single source of truth lives at vezir/__init__.py:__version__.
# Mirrors the pattern used in millet-record (formerly meetscribe-record)
# since M6c.i.
version = {attr = "vezir.__version__"}

[project.optional-dependencies]
# Server side: full FastAPI app + worker that shells out to millet
# (transcribe, label, sync).  Install on the GPU box that runs `vezir serve`.
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    # vezir 0.4.0's worker shells out to `millet transcribe --summary-preset
    # <id>` and relies on apply_labels() accepting the summary_preset kwarg.
    # Pin to >= 0.9.0 (the rename release of meetscribe-offline) so a
    # fresh `pip install vezir[server]` gets the renamed pipeline that
    # matches the rest of the vezir 0.4.0 stack.
    "millet-pipeline>=0.9.0",
    # Pure-Python QR generation (~76 KB) for the device enrollment page.
    # See vezir/server/enroll.py.
    "segno>=1.5",
    # MLX Whisper ASR backend, auto-detected on Apple Silicon by
    # vezir.config.meet_asr_backend(). Pulled only on Darwin/arm64;
    # pip skips this line on Linux/Windows via the environment marker.
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# GUI scribe widget (Tkinter). Tkinter ships with Python on most distros
# but some (Debian/Ubuntu minimal) require `apt install python3-tk`.
# No new pip deps needed.
gui = []
# TUI thin client: Textual-based desktop client that matches vezir-android
# 0.2.5 feature parity. Replaces `vezir gui` for everything except the
# always-on-top floating record widget. `pip install vezir[tui]` pulls
# textual; the optional `serve` mode additionally needs textual-serve
# (install separately when you want to publish the TUI over HTTP).
tui = ["textual>=0.80"]
dev = ["ruff", "pytest", "pytest-asyncio", "pytest-timeout", "mypy"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "RUF"]
"vezir/client/tui/*.py" = ["RUF012"]
"vezir/client/gui.py" = ["RUF012"]
"vezir/client/scribe_widget.py" = ["RUF012"]
"vezir/server/uploads.py" = ["B008"]
"vezir/server/teams.py" = ["B008"]
"vezir/server/labels.py" = ["B008"]
"vezir/server/migrations.py" = ["RUF002", "RUF003"]
"vezir/server/meet_runner.py" = ["E501"]
"vezir/client/audio.py" = ["RUF003"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["vezir.config", "vezir.doctor", "vezir.client.tui.record_screen"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
# Auto-collect `async def` tests written for textual.pilot without
# requiring a per-test @pytest.mark.asyncio decorator. Matches the
# pattern Textual's own test suite uses.
asyncio_mode = "auto"
# Per-test timeout (seconds). Any test exceeding this is likely stuck on
# a network call or audio device. Prevents CI from hanging indefinitely.
timeout = 60
